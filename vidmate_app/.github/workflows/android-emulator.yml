name: Android Emulator Tests

on:
  workflow_dispatch:

jobs:
  test-emulator:
    name: Run Tests on Android Emulator
    runs-on: macos-latest # macOS runners have reliable hardware acceleration for Android emulators

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v3
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Integration / Widget Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel
          script: flutter test test/widget_test.dart

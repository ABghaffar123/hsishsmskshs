name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vidmate_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        continue-on-error: true
        run: flutter analyze

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Debug: List built APK files
        run: |
          ls -lh build/app/outputs/flutter-apk/
          echo "=== Found APK files ==="
          find build/app/outputs/flutter-apk/ -name "*.apk" -type f

      - name: Show APK files
        if: always()
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk" -print

      - name: Debug: List built APK files in repo-root view
        run: find vidmate_app/build -name "*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: vidmate_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14